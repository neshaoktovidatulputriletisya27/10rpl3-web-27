<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Colorful Microsite</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND -->
    <div class="lingkaran satu"></div>
    <div class="lingkaran dua"></div>
    <div class="lingkaran tiga"></div>


    <!-- KARTU UTAMA -->
    <div class="container">

        <!-- FOTO -->
        <img src="foto.jpg" alt="Foto Profil" class="foto">


        <!-- NAMA -->
        <h1>Nesha 🌷</h1>

        <p class="deskripsi">
            Pelajar | Creative Girl | Digital Enthusiast
        </p>


        <!-- TENTANG -->
        <div class="tentang">
            <p>
                ✨ Welcome to my little space ✨
            </p>

            <p>
                Hai! Ini adalah microsite pribadiku.
                Yuk kenal lebih dekat denganku! 💕
            </p>
        </div>


        <!-- MENU -->
        <div class="menu">

            <a href="#" class="tombol pink">
                🌸 Tentang Saya
            </a>

            <a href="#" class="tombol ungu">
                🎨 My Portfolio
            </a>

            <a href="#" class="tombol biru">
                💻 My Project
            </a>

            <a href="#" class="tombol kuning">
                📸 Galeri Foto
            </a>

        </div>


        <!-- SOSIAL MEDIA -->
        <h2>💌 Temukan Aku</h2>

        <div class="sosmed">

            <a href="https://instagram.com/"
               target="_blank"
               class="instagram">
                Instagram
            </a>

            <a href="https://tiktok.com/"
               target="_blank"
               class="tiktok">
                TikTok
            </a>

            <a href="https://youtube.com/"
               target="_blank"
               class="youtube">
                YouTube
            </a>

        </div>


        <!-- FOOTER -->
        <p class="footer">
            Made with 💗 by Nesha
        </p>

    </div>

</body>
</html>
